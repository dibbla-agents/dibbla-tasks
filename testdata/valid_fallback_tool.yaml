version: "1"

tools:
  go:
    check: "go version"
    bin_path: "~/.local/go/bin"
    install:
      darwin: "brew install go"
      windows: "winget install --id GoLang.Go -e"
    install_fallback:
      darwin: 'curl -fsSL "https://go.dev/dl/go1.26.2.darwin-$(uname -m).tar.gz" | tar -xz -C ~/.local'
  node:
    check: "node --version"
    bin_path: "~/.local/node/bin"
    install:
      darwin: "brew install node"
    install_fallback:
      darwin: 'curl -fsSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-arm64.tar.gz" | tar -xz -C ~/.local && mv ~/.local/node-v* ~/.local/node'
  simple:
    check: "simple --version"
    install:
      darwin: "brew install simple"

steps:
  - id: verify-go
    name: "Verify Go"
    type: tool_check
    tool: go

  - id: verify-node
    name: "Verify Node.js"
    type: tool_check
    tool: node

  - id: verify-simple
    name: "Verify Simple (no fallback)"
    type: tool_check
    tool: simple

  - id: build
    name: "Build"
    type: command
    run: "echo build"
    depends_on: ["verify-go", "verify-node", "verify-simple"]
